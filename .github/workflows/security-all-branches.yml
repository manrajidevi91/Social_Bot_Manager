name: security-all-branches
on:
  push:
    paths:
      - .github/workflows/security-all-branches.yml
      - security_audit/verify_published_branches.py
      - security_audit/published_branch_heads.json
permissions:
  contents: read
jobs:
  published-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          set -eu
          V=8.30.1
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Verify every frozen published branch
        run: python3 security_audit/verify_published_branches.py
